name: Frontier Console Live Admission (read-only)

# Separate from PR checks: a broken or stale production deployment must be
# visible as a HOLD, without allowing external availability to bypass source CI.
on:
  workflow_dispatch:
  schedule:
    - cron: '19 */4 * * *'

permissions:
  contents: read

concurrency:
  group: frontier-console-live-admission
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout versioned admission policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Confirm admission unit tests before probing
        run: python3 -m unittest discover -s tests -p 'test_live_admission.py' -v
      - name: Measure external GitHub-Hugging Face-live parity
        run: python3 tools/live_admission.py
