name: Frontier Console Source Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Validate front-end JavaScript syntax, response integrity, and freshness guards
        run: node --test tests/frontend_contract.test.cjs
      - name: Compile source without importing dependencies
        run: python3 -m py_compile app.py
      - name: Validate receipt, health, and route contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  installed-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Check the reviewed requirements lock against its inputs
        run: |
          uv pip compile requirements.txt --default-index https://pypi.org/simple --python-version 3.11.18 --universal --generate-hashes --only-binary :all: --no-annotate --no-header -o requirements.lock
          git diff --exit-code -- requirements.lock
      - name: Build and exercise the default image command without egress or credentials
        run: bash tools/smoke_image.sh
