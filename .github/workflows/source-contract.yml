name: Frontier Console Source Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile source without importing dependencies
        run: python3 -m py_compile app.py
      - name: Validate receipt, health, and route contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
